{% load formato_comercial %}
<article class="card tarjeta-personal tarjeta-producto rounded-4 h-100">
  <a class="card-body p-3 p-md-4 text-decoration-none link-body-emphasis" href="{% url 'cliente:ficha_producto' producto.pk %}{% if parametros_tarjetas %}?{{ parametros_tarjetas }}{% endif %}" aria-label="Ver producto {{ producto.nombre_producto }}, {{ producto.marca }}">
    <div class="imagen-tarjeta">
      {% if producto.fotografia_disponible %}
        <img class="object-fit-contain rounded-3" src="{% url 'cliente:fotografia_producto' producto.pk %}" alt="Fotografía comercial de {{ producto.nombre_producto }}" loading="lazy">
      {% endif %}
    </div>
    <h3 class="h6 mb-2">{{ producto.nombre_producto }}</h3>
    <p class="marca-producto">{{ producto.marca }}</p>
    <p class="precio-producto">{{ producto.precio_normal|precio_clp }}</p>
    {% include "catalogo/stock_publico.html" %}
  </a>
</article>
